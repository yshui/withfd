[package]
name = "withfd"
description = "Send and receive data along with file descriptors"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [ "Yuxuan Shui <yshuiv7@gmail.com>" ]
categories = [ "os::unix-apis" ]
keywords = [ "fd", "file_descriptor", "unix", "socket" ]
repository = "https://github.com/yshui/withfd"
documentation = "https://docs.rs/withfd"

[dependencies]
nix = { version = "0.31.3", default-features = false, features = ["socket", "uio", "fs"] }
tokio = { version = "1", features = ["net"], optional = true }
async-io = { version = "2.3.0", optional = true }
futures-io = { version = "0.3.0", optional = true }
pin-project = { version = "1.1.0", optional = true }

[features]
default = []
async-io = [ "dep:futures-io", "dep:async-io", "dep:pin-project" ]

[dev-dependencies]
cstr = "0.2.11"
tokio = { version = "1", features = ["rt", "macros", "io-util", "time"] }
futures-util = { version = "0.3.0", features = ["io"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
